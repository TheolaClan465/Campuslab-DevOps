name: Build and Deploy Microservice

on:
  repository_dispatch:
    types: [deploy-service]

  workflow_dispatch:
    inputs:
      service:
        description: Microservicio a desplegar
        required: true
        type: choice
        options:
          - bff
          - catalog
          - booking
          - notify

      ref:
        description: Branch, tag o commit
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.client_payload.service || inputs.service }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v7.0.1
        with:
          path: pipeline
          persist-credentials: false
      # ==========================================================
      # 1. Determinar qué microservicio debemos procesar
      # ==========================================================

      - name: Resolver configuración del microservicio
        id: config
        shell: bash
        env:
          EVENT_SERVICE: ${{ github.event.client_payload.service }}
          MANUAL_SERVICE: ${{ inputs.service }}
          EVENT_SHA: ${{ github.event.client_payload.sha }}
          MANUAL_REF: ${{ inputs.ref }}
          SOURCE_OWNER: ${{ vars.SOURCE_OWNER }}

        run: |
          set -euo pipefail

          SERVICE="${EVENT_SERVICE:-$MANUAL_SERVICE}"
          REF="${EVENT_SHA:-${MANUAL_REF:-main}}"
          [[ "$SOURCE_OWNER" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]] || { echo 'Configura SOURCE_OWNER'; exit 1; }
          [[ "$REF" != *$'\n'* && "$REF" != *$'\r'* ]] || exit 1
          BUILD_CONTEXT="./service"
          DOCKERFILE="./service/Dockerfile"

          case "$SERVICE" in

            bff)
              REPOSITORY="$SOURCE_OWNER/campuslab-ms-bff"
              ECR_REPOSITORY="campuslab-ms-bff"
              ;;

            catalog)
              REPOSITORY="$SOURCE_OWNER/campuslab-ms-catalog"
              ECR_REPOSITORY="campuslab-ms-catalog"
              ;;

            booking)
              REPOSITORY="$SOURCE_OWNER/campuslab-ms-bookings"
              ECR_REPOSITORY="campuslab-ms-bookings"
              ;;

            notify)
              REPOSITORY="$SOURCE_OWNER/campuslab-ms-notify"
              ECR_REPOSITORY="campuslab-ms-notify"
              ;;

            *)
              echo "Microservicio desconocido: $SERVICE"
              exit 1
              ;;

          esac

          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "ecr_repository=$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "build_context=$BUILD_CONTEXT" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"

          echo "Microservicio: $SERVICE"
          echo "Repositorio: $REPOSITORY"
          echo "Referencia: $REF"

      # ==========================================================
      # 2. Descargar repo privado
      # ==========================================================

      - name: Checkout microservicio
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ steps.config.outputs.repository }}
          ref: ${{ steps.config.outputs.ref }}
          token: ${{ secrets.SOURCE_REPOS_PAT }}
          path: service
          persist-credentials: false

      # ==========================================================
      # 3. Obtener SHA real
      # ==========================================================

      - name: Obtener commit
        id: git
        working-directory: service
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          echo "Commit: $SHA"

      # ==========================================================
      # 4. Configurar credenciales de AWS
      # ==========================================================

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ==========================================================
      # 5. Iniciar sesión en Amazon ECR
      # ==========================================================

      - name: Login Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ==========================================================
      # 6. Construir imagen
      # ==========================================================

      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.config.outputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.git.outputs.sha }}
          BUILD_CONTEXT: ${{ steps.config.outputs.build_context }}
          DOCKERFILE: ${{ steps.config.outputs.dockerfile }}

        run: |
          set -euo pipefail
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            -f "$DOCKERFILE" \
            "$BUILD_CONTEXT"

      # ==========================================================
      # 7. Subir imagen a ECR
      # ==========================================================

      - name: Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.config.outputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.git.outputs.sha }}

        run: |
          set -euo pipefail
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      # ==========================================================
      # 8. Configurar SSH
      # ==========================================================

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BASTION_HOST: ${{ vars.BASTION_HOST }}
          PRIVATE_EC2_HOST: ${{ vars.PRIVATE_EC2_HOST }}
          BASTION_USER: ${{ vars.BASTION_USER || 'ec2-user' }}
          EC2_USER: ${{ vars.EC2_USER || 'ec2-user' }}

        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          for HOST in "$BASTION_HOST" "$PRIVATE_EC2_HOST"; do
            [[ "$HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || exit 1
          done
          for USER in "$BASTION_USER" "$EC2_USER"; do
            [[ "$USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || exit 1
          done
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/ms-campuslab.pem

          chmod 600 ~/.ssh/ms-campuslab.pem

          cat > ~/.ssh/config << EOF

          Host campus-bastion
              HostName $BASTION_HOST
              User $BASTION_USER
              IdentityFile ~/.ssh/ms-campuslab.pem
              IdentitiesOnly yes
              BatchMode yes
              ConnectTimeout 15
              StrictHostKeyChecking accept-new

          Host campus-private
              HostName $PRIVATE_EC2_HOST
              User $EC2_USER
              IdentityFile ~/.ssh/ms-campuslab.pem
              IdentitiesOnly yes
              ProxyJump campus-bastion
              BatchMode yes
              ConnectTimeout 15
              StrictHostKeyChecking accept-new

          EOF

          chmod 600 ~/.ssh/config

      - name: Comprobar servicio en Compose remoto
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/ec2-user' }}
          SERVICE: ${{ steps.config.outputs.service }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          printf -v COMMAND 'bash -s -- %q %q %q' "$DEPLOY_DIR" "$SERVICE" "$REGISTRY"
          ssh campus-private "$COMMAND" <<'REMOTE'
          set -euo pipefail
          cd "$1" || { echo "ERROR: DEPLOY_DIR no existe: $1"; exit 1; }
          echo "Carpeta de despliegue: $PWD"
          command -v flock >/dev/null || { echo 'ERROR: falta flock en EC2'; exit 1; }
          if ! SERVICES=$(sudo -n env ECR_REGISTRY="$3" docker compose config --services); then
            echo 'ERROR: no se pudo leer Compose. Revisar archivo, .env, variables requeridas y permisos Docker/sudo.'
            exit 1
          fi
          printf 'Servicios encontrados:\n%s\n' "$SERVICES"
          if ! grep -Fx -- "$2" <<< "$SERVICES"; then
            echo "ERROR: el Compose remoto no incluye el servicio $2."
            echo 'Copiar el docker-compose.yml actualizado de back a DEPLOY_DIR y revisar overrides/COMPOSE_FILE.'
            exit 1
          fi
          REMOTE

      # ==========================================================
      # 9. Login ECR desde EC2 privada
      # ==========================================================

      - name: Login ECR en EC2 privada
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ vars.AWS_REGION }}

        run: |
          set -euo pipefail
          printf -v COMMAND 'sudo -n docker login --username AWS --password-stdin %q' "$REGISTRY"
          aws ecr get-login-password \
            --region "$AWS_REGION" | ssh campus-private "$COMMAND"

      # ==========================================================
      # 10. Actualizar solamente el microservicio modificado
      # ==========================================================

      - name: Deploy
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE: ${{ steps.config.outputs.service }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/ec2-user' }}
          REPOSITORY: ${{ steps.config.outputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.git.outputs.sha }}

        run: |
          set -euo pipefail
          printf -v COMMAND 'bash -s -- %q %q %q %q' \
            "$DEPLOY_DIR" "$SERVICE" "$REGISTRY" "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          ssh campus-private "$COMMAND" < pipeline/ec2/deploy.sh

      # ==========================================================
      # 11. Comprobar contenedores
      # ==========================================================

      - name: Estado final
        run: |
          ssh campus-private "sudo docker ps"

      - name: Limpiar clave SSH del runner
        if: always()
        run: rm -f ~/.ssh/ms-campuslab.pem ~/.ssh/config
